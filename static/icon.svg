<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="38%" cy="32%" r="70%">
      <stop offset="0%" stop-color="#0d2244"/>
      <stop offset="100%" stop-color="#04091a"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>

  <!-- Globe: outer ring -->
  <circle cx="256" cy="268" r="158" fill="none" stroke="#4ab8e8" stroke-width="5" opacity=".45"/>

  <!-- Globe: equator -->
  <ellipse cx="256" cy="268" rx="158" ry="52" fill="none" stroke="#4ab8e8" stroke-width="4" opacity=".35"/>

  <!-- Globe: one longitude arc (right side) -->
  <path d="M256 110 Q310 188 310 268 Q310 348 256 426"
        fill="none" stroke="#4ab8e8" stroke-width="3" opacity=".25"/>

  <!-- Gold route arc — main visual anchor, bold -->
  <path d="M130 370 Q200 170 380 158"
        fill="none" stroke="#ffc146" stroke-width="14"
        stroke-linecap="round" opacity=".92"/>

  <!-- Cyan radar sweep wedge -->
  <path d="M256 268 L256 124 A144 144 0 0 1 382 196 Z"
        fill="#4ab8e8" fill-opacity=".08"
        stroke="#4ab8e8" stroke-width="3" stroke-linejoin="round" opacity=".6"/>

  <!-- Radar sweep leading edge — single bright line -->
  <line x1="256" y1="268" x2="382" y2="196"
        stroke="#4ab8e8" stroke-width="3.5" opacity=".7" stroke-linecap="round"/>
  <line x1="256" y1="268" x2="256" y2="124"
        stroke="#4ab8e8" stroke-width="2.5" opacity=".4" stroke-linecap="round"/>

  <!-- Gold dot: departure point on arc -->
  <circle cx="148" cy="355" r="10" fill="#ffc146" opacity=".9"/>

  <!-- Cyan dot: arrival point on arc -->
  <circle cx="372" cy="162" r="10" fill="#4ab8e8" opacity=".9"/>
</svg>
